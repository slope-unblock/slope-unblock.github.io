name: Build, verify and deploy Slope

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators and browsers
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium firefox
      - name: Prepare clean static artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='*.zip' \
            --exclude='README-RU.md' \
            ./ _site/
      - name: Vendor and verify all real game images
        run: python .github/scripts/vendor_media.py --root _site --strip-remote-fallbacks
      - name: Static release audit
        run: python .github/scripts/release_check.py --root _site
      - name: Chromium and Firefox responsive audit
        run: python .github/scripts/multi_browser_check.py --root _site --out predeploy-browser-results.json
      - name: Save fully built static site
        uses: actions/upload-artifact@v4
        with:
          name: slope-unblock-final-static
          path: _site
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Wait for Pages propagation
        run: sleep 25
      - name: Verify all seven game launchers on production
        run: python .github/scripts/live_smoke.py --origin "${{ needs.deploy.outputs.page_url }}" --browser "${{ matrix.browser }}" --out "live-smoke-${{ matrix.browser }}.json" --screenshots "live-smoke-${{ matrix.browser }}-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slope-production-smoke-${{ matrix.browser }}
          path: |
            live-smoke-${{ matrix.browser }}.json
            live-smoke-${{ matrix.browser }}-screenshots
